name: Linux check

# Follows the README macOS/Linux steps on a clean Ubuntu machine: install, download the core data bundle, run.sh, search a photo.
# Manual run only (it downloads about 0.7 GB of data and 1.3 GB of models and takes a few minutes).
on:
  workflow_dispatch:
  push:
    branches: [worktree-linux-check]

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEVICE: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install (README steps)
        run: |
          uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -r requirements.txt
          .venv/bin/python -c "import torch, fastapi; print('install ok', torch.__version__)"

      - name: Download and unpack the core data bundle (Google Drive)
        run: |
          curl -sL -o shop-the-look-data-core.tar "https://drive.usercontent.google.com/download?id=1ZURkBRv8Co3X5mW842BTus9X0ry4YfuT&export=download&confirm=t"
          size=$(stat -c %s shop-the-look-data-core.tar); echo "downloaded $size bytes (expected 742572544)"
          [ "$size" -eq 742572544 ]
          tar -xf shop-the-look-data-core.tar --exclude "._*"
          junk=$(find data -name "._*" | wc -l); echo "macOS metadata files left: $junk"
          [ "$junk" -eq 0 ]

      - name: Run the app with run.sh and test it
        run: |
          ./run.sh > server.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 10; done
          curl -sf http://127.0.0.1:8000/api/health || { tail -60 server.log; exit 1; }
          echo
          curl -sf -o /dev/null -w "UI status %{http_code}\n" http://127.0.0.1:8000/
          samples=$(curl -sf http://127.0.0.1:8000/api/samples); echo "$samples" | head -c 300; echo
          .venv/bin/python -c "import json,sys; s=json.loads(sys.argv[1]); assert len(s)==12 and not any('/.' in x for x in s), s" "$samples"
          scene=$(ls data/scenes/*.jpg | head -1)
          curl -sS -m 300 -F "file=@$scene" -o search.json -w "HTTP %{http_code}\n" http://127.0.0.1:8000/api/search
          .venv/bin/python -c "import json; d=json.load(open('search.json')); n=len(d['items']); print(n,'items:',[i['label'] for i in d['items']]); assert n>0, d"
          API=127.0.0.1:8000 .venv/bin/python tests/edge_cases.py

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: server.log
          if-no-files-found: ignore
