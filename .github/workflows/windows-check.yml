name: Windows check

# Follows the README steps on a clean Windows machine: install, download the core data bundle, run.bat, search a photo.
# Manual run only (it downloads about 0.7 GB of data and 1.3 GB of models, and takes 15 to 30 minutes).
on:
  workflow_dispatch:
  push:
    branches: [windows-ci]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DEVICE: cpu
      API: 127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install (README steps)
        run: |
          uv venv --python 3.12 .venv
          if ($LASTEXITCODE -ne 0) { exit 1 }
          uv pip install --python .venv\Scripts\python.exe -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .venv\Scripts\python.exe -c "import torch, fastapi; print('install ok', torch.__version__)"

      - name: Download and unpack the core data bundle (Google Drive)
        run: |
          curl.exe -sL -o shop-the-look-data-core.tar "https://drive.usercontent.google.com/download?id=1ZURkBRv8Co3X5mW842BTus9X0ry4YfuT&export=download&confirm=t"
          $size = (Get-Item shop-the-look-data-core.tar).Length
          Write-Host "downloaded $size bytes (expected 742572544)"
          if ($size -ne 742572544) { exit 1 }
          tar -xf shop-the-look-data-core.tar
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem data | Select-Object Name

      - name: Start the app with run.bat and wait for it
        run: |
          Start-Process -FilePath ".\run.bat" -RedirectStandardOutput server.out.log -RedirectStandardError server.err.log -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 120; $i++) {
            try { $h = Invoke-RestMethod http://127.0.0.1:8000/api/health -TimeoutSec 5; $ok = $true; break } catch { Start-Sleep -Seconds 10 }
          }
          if (-not $ok) { Get-Content server.out.log, server.err.log -Tail 60; exit 1 }
          $h | ConvertTo-Json

      - name: Search a real photo and open the UI
        run: |
          $scene = (Get-ChildItem data\scenes\*.jpg | Select-Object -First 1).FullName
          curl.exe -s -F "file=@$scene" -o search.json http://127.0.0.1:8000/api/search
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .venv\Scripts\python.exe -c "import json; d = json.load(open('search.json', encoding='utf-8')); n = len(d['items']); print(n, 'items detected'); assert n > 0, d"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $r = Invoke-WebRequest http://127.0.0.1:8000/ -UseBasicParsing
          Write-Host "UI status $($r.StatusCode)"
          if ($r.StatusCode -ne 200) { exit 1 }

      - name: Edge cases (tests/edge_cases.py)
        run: |
          .venv\Scripts\python.exe tests\edge_cases.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            server.out.log
            server.err.log
          if-no-files-found: ignore
