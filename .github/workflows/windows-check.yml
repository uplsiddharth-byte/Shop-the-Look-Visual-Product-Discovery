name: Windows check

# Follows the README steps on a clean Windows machine: install, download the core data bundle, run.bat, search a photo.
# Manual run only (it downloads about 0.7 GB of data and 1.3 GB of models and takes a few minutes).
on:
  workflow_dispatch:
  push:
    branches: [windows-ci]

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DEVICE: cpu
      API: 127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Install (README steps)
        run: |
          uv venv --python 3.12 .venv
          if ($LASTEXITCODE -ne 0) { exit 1 }
          uv pip install --python .venv\Scripts\python.exe -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .venv\Scripts\python.exe -c "import torch, fastapi; print('install ok', torch.__version__)"

      - name: Download and unpack the core data bundle (Google Drive)
        run: |
          curl.exe -sL -o shop-the-look-data-core.tar "https://drive.usercontent.google.com/download?id=1ZURkBRv8Co3X5mW842BTus9X0ry4YfuT&export=download&confirm=t"
          $size = (Get-Item shop-the-look-data-core.tar).Length
          Write-Host "downloaded $size bytes (expected 742572544)"
          if ($size -ne 742572544) { exit 1 }
          tar -xf shop-the-look-data-core.tar --exclude "._*"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $junk = (Get-ChildItem data -Recurse -Force -Filter "._*" | Measure-Object).Count
          Write-Host "macOS metadata files left after unpacking: $junk"
          if ($junk -ne 0) { exit 1 }
          Get-ChildItem data | Select-Object Name

      # One step on purpose: the runner stops processes started in a step when that step ends.
      - name: Run the app with run.bat and test it
        run: |
          Start-Process -FilePath ".\run.bat" -RedirectStandardOutput server.out.log -RedirectStandardError server.err.log -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 120; $i++) {
            try { $h = Invoke-RestMethod http://127.0.0.1:8000/api/health -TimeoutSec 5; $ok = $true; break } catch { Start-Sleep -Seconds 10 }
          }
          if (-not $ok) { Get-Content server.out.log, server.err.log -Tail 60; exit 1 }
          Write-Host "health: $($h | ConvertTo-Json -Compress)"

          $r = Invoke-WebRequest http://127.0.0.1:8000/ -UseBasicParsing
          Write-Host "UI status $($r.StatusCode)"
          if ($r.StatusCode -ne 200) { exit 1 }

          $samples = Invoke-RestMethod http://127.0.0.1:8000/api/samples
          Write-Host "sample thumbnails: $($samples.Count), first: $($samples[0])"
          $t = Invoke-WebRequest "http://127.0.0.1:8000$($samples[0])" -UseBasicParsing
          Write-Host "first thumbnail: status $($t.StatusCode), $($t.Headers['Content-Type']), $($t.Content.Length) bytes"
          if ($samples.Count -ne 12 -or $samples[0] -like "*/.*" -or $t.Headers['Content-Type'] -notlike "image/*") { exit 1 }

          $scene = (Get-ChildItem data\scenes\*.jpg | Select-Object -First 1).FullName
          curl.exe -sS -m 300 -F "file=@$scene" -o search.json -w "HTTP %{http_code}`n" http://127.0.0.1:8000/api/search
          Write-Host "curl exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .venv\Scripts\python.exe -c "import json; d = json.load(open('search.json', encoding='utf-8')); n = len(d['items']); print(n, 'items detected:', [i['label'] for i in d['items']]); assert n > 0, d"
          if ($LASTEXITCODE -ne 0) { exit 1 }

          .venv\Scripts\python.exe tests\edge_cases.py
          $edge = $LASTEXITCODE
          Get-Process -Name python -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($edge -ne 0) { exit 1 }

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            server.out.log
            server.err.log
          if-no-files-found: ignore
