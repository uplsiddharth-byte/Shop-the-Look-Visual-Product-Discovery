<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop the Look</title>
  <meta name="description" content="Upload an outfit photo and find the closest matching pieces in the catalog.">
  <link rel="preload" href="vendor/geist.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/phosphor.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="bar">
    <a class="brand" href="/" aria-label="Shop the Look, home">Shop the Look</a>
    <div class="bar-right">
      <label class="switch" for="ext" title="Also search products from the public Fashion Product Images dataset">
        <input type="checkbox" id="ext" checked>
        <span class="track" aria-hidden="true"></span>
        <span id="extLabel">Extended catalog</span>
      </label>
      <div class="dots" id="theme" role="group" aria-label="Colour theme">
        <button type="button" data-t="dark" aria-label="Dark theme"></button>
        <button type="button" data-t="light" aria-label="Light theme"></button>
        <button type="button" data-t="blush" aria-label="Red theme"></button>
      </div>
    </div>
  </header>

  <main id="main">
    <!-- Stage: upload, then scene with detected boxes -->
    <section class="stage" aria-label="Your photo">
      <div class="intro" id="intro">
        <h1>Shop the Look<sup>&reg;</sup></h1>
        <div class="meta">
          <span class="lab">How it works</span>
          <p>Upload an outfit photo. We pick out each piece, match it to the catalog and tell you if the exact product is there.</p>
          <label class="drop" id="drop" for="file" tabindex="0">
            <input id="file" type="file" accept="image/*" hidden>
            <i class="ph ph-arrow-up" aria-hidden="true"></i>
            <strong>Drop a photo here</strong>
            <span>or click to browse. JPG or PNG, up to 10 MB.</span>
          </label>
        </div>
      </div>

      <figure class="scene" id="scene" hidden>
        <div class="frame" id="frame">
          <img id="sceneImg" alt="Uploaded outfit with detected items outlined">
          <div class="boxes" id="boxes"></div>
          <div class="scan" id="scan" aria-hidden="true"></div>
        </div>
        <figcaption>
          <span id="status" role="status" aria-live="polite"></span>
          <button class="ghost" id="again" type="button"><i class="ph ph-arrow-counter-clockwise" aria-hidden="true"></i>New photo</button>
        </figcaption>
      </figure>

      <div class="samples" id="samplesWrap">
        <h2>Or try one of these</h2>
        <div class="thumbs" id="samples"></div>
      </div>
    </section>

    <!-- Results: item cards flank the photo on desktop -->
    <section class="results" id="results" aria-label="Matches" aria-live="polite" hidden></section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
